# Unit tests for the validator itself ("testing the tester").
#
# Runs whenever the validator, its rules or its tests change, so a broken rule
# or regex is caught before it can start passing bad processes or failing good ones.

name: Validator tests

on:
  pull_request:
    paths:
      - "validation/**"
      - "tests/**"
      - "boomi-processes/**"
      - "pyproject.toml"
      - "requirements-dev.txt"
      - ".github/workflows/validator-tests.yml"
  push:
    branches: [main]
    paths:
      - "validation/**"
      - "tests/**"
      - "boomi-processes/**"
      - "pyproject.toml"
      - "requirements-dev.txt"
      - ".github/workflows/validator-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validator-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported version (tomllib arrived in 3.11) and the one CI validates with.
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v
