[project]
name = "wonka-xml-validation"
version = "1.0.0"
description = "CI validation of Boomi process XML against Wonka's Factory Safety Standards"
requires-python = ">=3.11"  # tomllib is in the standard library from 3.11
dependencies = []           # the validator itself uses only the standard library

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["validation"]
addopts = "-ra"
